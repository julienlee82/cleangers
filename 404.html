<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 파워클린져스</title>
<meta name="robots" content="noindex, follow">
<style>
  :root{--navy:#0f2540;--blue:#1667d9;--ink:#1c2733;--gray:#5b6b7b;--line:#e3e9f0;--accent:#ff8a00}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;color:var(--ink);line-height:1.65;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:#fff}
  .box{max-width:560px;width:100%;text-align:center}
  .code{font-size:clamp(56px,14vw,88px);font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.02em}
  h1{font-size:clamp(19px,4vw,25px);color:var(--navy);margin:16px 0 10px;font-weight:800}
  p{color:var(--gray);font-size:clamp(14px,2.4vw,16px);margin-bottom:30px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;padding:14px 26px;border-radius:10px;font-size:16px;font-weight:800;text-decoration:none}
  .primary{background:var(--blue);color:#fff}
  .ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .call{background:var(--accent);color:#fff}
  .foot{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);color:var(--gray);font-size:13px}
  .foot strong{color:var(--navy)}
</style>
</head>
<body>
<main class="box">
  <div class="code">404</div>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같습니다.<br>아래에서 홈으로 가시거나 바로 견적을 문의해 주세요.</p>
  <div class="row">
    <a class="btn primary" href="/">홈으로 가기</a>
    <a class="btn call" href="tel:0507-1468-0941">전화 문의 0507-1468-0941</a>
    <a class="btn ghost" href="https://pf.kakao.com/_PSxfan/chat" target="_blank" rel="noopener">카카오톡 상담</a>
  </div>
  <div class="foot">
    <strong>파워클린져스</strong> · 건물외벽청소 · 유리창청소 · 특수구역 고압세척<br>
    부산 · 울산 · 대구 · 경남 · 경북
  </div>
</main>
</body>
</html>
